name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Fetch Inter fonts
        run: |
          mkdir -p app/src/main/res/font
          curl -sL -o app/src/main/res/font/inter_regular.ttf   "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_medium.ttf    "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_semibold.ttf  "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuGKYMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_bold.ttf      "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_extrabold.ttf "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuDyYMZg.ttf"
          ls -l app/src/main/res/font

      # The release keystore is COMMITTED (base64) so every build is signed with the
      # SAME key. Generating a fresh keystore per run is what caused Android to reject
      # updates with "App not installed" (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      - name: Restore stable signing keystore
        run: |
          mkdir -p keystore
          base64 -d signing/release.jks.b64 > keystore/release.jks
          keytool -list -keystore keystore/release.jks -storepass aethertunnel | grep -E "aether|SHA256" || true
          echo "Keystore SHA256 fingerprint:"
          keytool -list -v -keystore keystore/release.jks -storepass aethertunnel | grep "SHA256:" || true

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify both APKs share one signing certificate
        run: |
          set -e
          python3 - <<'PY'
          import struct, hashlib, glob, sys

          def cert_sha256(path):
              d = open(path, 'rb').read()
              eocd = d.rfind(b'PK\x05\x06')
              cd_size, cd_off = struct.unpack_from('<II', d, eocd + 12)
              if d[cd_off - 16:cd_off] != b'APK Sig Block 42':
                  return None
              size = struct.unpack_from('<Q', d, cd_off - 24)[0]
              start = cd_off - size - 8
              block = d[start:cd_off - 16]
              pos, out = 8, {}
              while pos < len(block) - 8:
                  ln = struct.unpack_from('<Q', block, pos)[0]
                  if ln == 0:
                      break
                  idv = block[pos + 8:pos + 8 + ln]
                  out[struct.unpack_from('<I', idv, 0)[0]] = idv[4:]
                  pos += 8 + ln
              v2 = out.get(0x7109871a)
              if not v2:
                  return None
              p = 0
              slen = struct.unpack_from('<I', v2, p)[0]; p += 4
              signer = v2[p:p + slen]
              q = 0
              sdlen = struct.unpack_from('<I', signer, q)[0]; q += 4
              sd = signer[q:q + sdlen]
              r = 0
              dlen = struct.unpack_from('<I', sd, r)[0]; r += 4
              r += dlen
              clen = struct.unpack_from('<I', sd, r)[0]; r += 4
              certs = sd[r:r + clen]
              c0len = struct.unpack_from('<I', certs, 0)[0]
              return hashlib.sha256(certs[4:4 + c0len]).hexdigest()

          apks = sorted(glob.glob('app/build/outputs/apk/**/*.apk', recursive=True))
          if not apks:
              print('no APKs found'); sys.exit(1)
          seen = {}
          for a in apks:
              h = cert_sha256(a)
              print(f'{a}  ->  {h}')
              seen[a] = h
          if len(set(seen.values())) != 1:
              print('ERROR: APKs are signed with different certificates'); sys.exit(1)
          print('OK: all APKs share one signing certificate')
          PY

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-tunnel-apk
          path: out/*.apk
          retention-days: 90
