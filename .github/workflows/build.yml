name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Fetch Inter fonts
        run: |
          mkdir -p app/src/main/res/font
          curl -sL -o app/src/main/res/font/inter_regular.ttf   "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_medium.ttf    "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_semibold.ttf  "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuGKYMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_bold.ttf      "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuFuYMZg.ttf"
          curl -sL -o app/src/main/res/font/inter_extrabold.ttf "https://fonts.gstatic.com/s/inter/v20/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuDyYMZg.ttf"
          ls -l app/src/main/res/font

      # The release keystore is COMMITTED (base64) so every build is signed with the
      # SAME key. Generating a fresh keystore per run is what caused Android to reject
      # updates with "App not installed" (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      - name: Restore stable signing keystore
        run: |
          mkdir -p keystore
          base64 -d signing/release.jks.b64 > keystore/release.jks
          keytool -list -keystore keystore/release.jks -storepass aethertunnel | grep -E "aether|SHA256" || true
          echo "Keystore SHA256 fingerprint:"
          keytool -list -v -keystore keystore/release.jks -storepass aethertunnel | grep "SHA256:" || true

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # The release APK must be signed with the committed keystore, otherwise Android
      # refuses to update an installed build ("App not installed"). apksigner is the
      # authoritative tool for this, so use it rather than hand-parsing the APK.
      # The debug APK is deliberately signed with the debug key (separate .debug app),
      # so only the release APK is checked.
      - name: Verify release APK signing certificate
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"

          keytool -exportcert -keystore keystore/release.jks -storepass aethertunnel -alias aether \
            | sha256sum | awk '{print $1}' > /tmp/keystore.sha
          echo "committed keystore cert SHA-256: $(cat /tmp/keystore.sha)"

          for apk in app/build/outputs/apk/release/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256 digest" | head -1
            "$APKSIGNER" verify --print-certs "$apk" \
              | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' > /tmp/apk.sha
            echo "apk cert SHA-256: $(cat /tmp/apk.sha)"
            if [ "$(cat /tmp/keystore.sha)" != "$(cat /tmp/apk.sha)" ]; then
              echo "ERROR: release APK is NOT signed with the committed keystore."
              echo "       Android would refuse to update an installed build."
              exit 1
            fi
          done
          echo "OK: release APK signed with the committed keystore (stable across builds)"

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-tunnel-apk
          path: out/*.apk
          retention-days: 90
